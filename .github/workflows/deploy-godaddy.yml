name: Deploy website to GoDaddy

# Runs every time the website files in site/ change on main, or when you press "Run workflow".
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-godaddy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_LOGIN: ${{ secrets.GODADDY_FTP_SERVER != '' && secrets.GODADDY_FTP_USERNAME != '' && secrets.GODADDY_FTP_PASSWORD != '' }}
    steps:
      - name: Waiting for the GoDaddy login
        if: env.HAS_LOGIN != 'true'
        run: echo "::notice::Add GODADDY_FTP_SERVER, GODADDY_FTP_USERNAME and GODADDY_FTP_PASSWORD in Settings > Secrets and variables > Actions, then run this workflow again."

      - name: Get the files
        if: env.HAS_LOGIN == 'true'
        uses: actions/checkout@v4

      - name: Copy the site folder to GoDaddy
        if: env.HAS_LOGIN == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./public_html/
